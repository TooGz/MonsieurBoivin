# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/getting-started/

theme = "blowfish"
baseURL = "https://monsieurboivin.fr"
defaultContentLanguage = "fr"
disableLanguages = [] #to allow translation work requiring shipping to production

# Dates du front matter sans fuseau interprétées à l'heure de Paris (et non en UTC)
timeZone = "Europe/Paris"

# URL sans accents : /categories/electronique/ plutôt que /categories/%C3%A9lectronique/
# (les anciennes adresses accentuées redirigent via les « aliases » de content/categories et content/tags)
removePathAccents = true

enableRobotsTXT = true
# Typographie française : seule la première lettre des titres de tags/catégories prend une capitale
# (« Desserts et goûter » et non « Desserts Et Goûter »)
titleCaseStyle = "firstupper"
summaryLength = 30
hasCJKLanguage = false

buildDrafts = false
buildFuture = false

enableEmoji = true

googleAnalytics = "G-GPMJSYNKQK"

[pagination]
  pagerSize = 9

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "series"
        weight = 50

    [[related.indices]]
        name = "authors"
        weight = 20

    [[related.indices]]
        name = "date"
        weight = 10

    [[related.indices]]
      applyFilter = false
      name = 'fragmentrefs'
      type = 'fragments'
      weight = 10
